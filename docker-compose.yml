# Development setup.  Start with:   docker compose up --build
# Then open http://localhost:8000/docs

name: excel-formula-generator

services:
  api:
    build: .
    container_name: efg-api
    ports:
      - "8000:8000"
    volumes:
      # Source code, live. Edit a .py file and the server reloads.
      - ./backend:/app
      # The analytics database on a NAMED VOLUME — inside Docker's own storage,
      # never in the project folder, so no sync tool can corrupt it.
      - analytics:/data
      # The page, served by the API at http://localhost:8000 so that the
      # browser sees one origin and has nothing to block. It lives in public/
      # because that is the directory Cloudflare serves as static assets —
      # one copy of the page, not two that drift apart.
      - ./public/index.html:/app/static/index.html:ro
    environment:
      DB_PATH: /data/analytics.db
      # Read from .env if present. Admin routes stay disabled until both are set;
      # generate them with:  python -m app.security.auth "your password"
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:5500}
      # Windows and WSL2 do not deliver file-change events reliably across the
      # host boundary, so the reloader polls instead.
      WATCHFILES_FORCE_POLLING: "true"
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    restart: unless-stopped

volumes:
  analytics:
